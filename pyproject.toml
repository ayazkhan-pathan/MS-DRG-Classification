[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drg"
version = "0.1.0"
description = "Predict MS-DRG codes from hospital discharge summaries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammed Ayazkhan Pathan" }]
requires-python = ">=3.9"
dependencies = [
    "accelerate>=0.26",
    "numpy>=1.23",
    "pandas>=1.5",
    "torch>=2.6",
    "transformers>=4.48,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.17,<0.18", "scikit-learn>=1.2"]
figures = ["matplotlib>=3.7"]
wandb = ["wandb"]

[project.scripts]
drg = "drg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
