name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # the newest runner image has no Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/constraints.txt torch \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c .github/constraints.txt -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
